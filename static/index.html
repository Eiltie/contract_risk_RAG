<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合同风险条款检索助手</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --high: #dc2626;
    --medium: #d97706;
    --low: #059669;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 60px; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { font-size: 26px; margin-bottom: 8px; }
  header p { color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  textarea {
    width: 100%; min-height: 96px; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; font-size: 15px; font-family: inherit; resize: vertical; line-height: 1.6;
  }
  textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
  .btn {
    margin-top: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px;
    padding: 10px 22px; font-size: 15px; cursor: pointer; font-family: inherit;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .example { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .example a { color: var(--primary); cursor: pointer; text-decoration: none; }
  .example a:hover { text-decoration: underline; }
  .hidden { display: none; }
  #loading { text-align: center; color: var(--muted); padding: 24px; }
  #error { color: var(--high); text-align: center; padding: 24px; }
  .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
  #answer { white-space: pre-wrap; font-size: 15px; }
  .case { border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 12px; }
  .case:last-child { margin-bottom: 0; }
  .case-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .case-title { font-weight: 600; font-size: 15px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .tag.high { background: var(--high); }
  .tag.medium { background: var(--medium); }
  .tag.low { background: var(--low); }
  .tag.gray { background: #6b7280; }
  .case-body { font-size: 14px; color: #374151; }
  .case-body strong { color: var(--text); }
  .case-body div { margin-bottom: 6px; }
  .case-body div:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>合同风险条款检索助手</h1>
    <p>用一句话描述你遇到的合同风险情形，帮你判断风险、找相似案例、给修改建议</p>
  </header>

  <div class="card">
    <textarea id="question" placeholder="例如：实习期间没有工资或者不按时发工资"></textarea>
    <button class="btn" id="ask">分析风险</button>
    <div class="example">
      试试：
      <a data-q="实习期间没有工资或者不按时发工资">实习期间没有工资</a> ·
      <a data-q="乙方要我们承担无限赔偿责任">无限赔偿责任</a> ·
      <a data-q="合同到期自动续约3年且涨价20%">自动续约涨价</a>
    </div>
  </div>

  <div id="loading" class="hidden">正在检索和分析，请稍候…</div>
  <div id="error" class="hidden"></div>

  <div id="result" class="hidden">
    <div class="card">
      <div class="section-title">风险分析</div>
      <div id="answer"></div>
    </div>
    <div class="card">
      <div class="section-title">参考案例</div>
      <div id="cases"></div>
    </div>
  </div>
</div>

<script>
  const askBtn = document.getElementById('ask');
  const question = document.getElementById('question');
  const loading = document.getElementById('loading');
  const errorEl = document.getElementById('error');
  const result = document.getElementById('result');
  const answerEl = document.getElementById('answer');
  const casesEl = document.getElementById('cases');

  const riskLabel = { high: '高风险', medium: '中风险', low: '低风险' };

  async function analyze() {
    const q = question.value.trim();
    if (!q) { question.focus(); return; }
    askBtn.disabled = true;
    loading.classList.remove('hidden');
    errorEl.classList.add('hidden');
    result.classList.add('hidden');
    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q }),
      });
      if (!resp.ok) { throw new Error('服务返回错误：' + resp.status); }
      const data = await resp.json();
      answerEl.textContent = data.answer || '（无结果）';
      renderCases(data.retrieved_cases || []);
      result.classList.remove('hidden');
    } catch (e) {
      errorEl.textContent = '出错了：' + e.message;
      errorEl.classList.remove('hidden');
    } finally {
      loading.classList.add('hidden');
      askBtn.disabled = false;
    }
  }

  function renderCases(cases) {
    if (!cases.length) {
      casesEl.innerHTML = '<div style="color:#6b7280">没有匹配到案例。</div>';
      return;
    }
    casesEl.innerHTML = cases.map(c => {
      const lv = c.risk_level || '';
      const badge = lv ? `<span class="tag ${lv}">${riskLabel[lv] || lv}</span>` : '';
      return `
        <div class="case">
          <div class="case-head">
            <span class="case-title">${c.title}</span>
            ${badge}
            <span class="tag gray">${c.risk_type}</span>
          </div>
          <div class="case-body">
            <div><strong>分析：</strong>${c.analysis}</div>
            <div><strong>建议：</strong>${c.suggestion}</div>
          </div>
        </div>`;
    }).join('');
  }

  askBtn.addEventListener('click', analyze);
  question.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') analyze();
  });
  document.querySelectorAll('.example a').forEach(a => {
    a.addEventListener('click', () => { question.value = a.dataset.q; });
  });
</script>
</body>
</html>
